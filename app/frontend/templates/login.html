{% extends "base.html" %}
{% block title %}Log in · Course Scheduler{% endblock %}
{% block body_class %}auth-body{% endblock %}
{% block content %}
<div class="auth">
  {% include "_auth_aside.html" %}
  <section class="card auth-form" aria-labelledby="login-title">
    <h2 id="login-title">Log in</h2>
    <p class="muted intro">Use the account your department gave you.</p>
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username <input name="username" required autofocus autocomplete="username"></label>
      <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
      <div class="form-actions">
        <button type="submit" class="button">Log in <span class="arrow" aria-hidden="true">→</span></button>
        <span class="muted">No account? <a href="{{ url_for('auth.register') }}">Register</a></span>
      </div>
    </form>
  </section>
</div>
{% endblock %}
